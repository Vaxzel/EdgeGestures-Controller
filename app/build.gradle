plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.edgegestureslock'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.edgegestureslock"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly files('../stubs')
    compileOnly 'de.robv.android.xposed:api:82'
}
